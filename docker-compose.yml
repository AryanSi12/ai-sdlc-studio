services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/ai_sdlc.db
      BOT_TOKEN: ${BOT_TOKEN:-dev-bot-token-change-me}
      CORS_ORIGINS: "*"
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - sdlc-data:/data
      - ./data:/import:ro
    command: >
      sh -c "python seed.py &&
             (test -f /import/tiny-todo-export.json && python scripts/import_data.py /import/tiny-todo-export.json --db /data/ai_sdlc.db || true) &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  sdlc-data:
